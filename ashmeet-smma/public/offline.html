<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6C5CE7">
  <title>You are offline</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#E8E8F6;color:#1B1B3A;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:420px;background:#fff;border-radius:22px;padding:28px;text-align:center;box-shadow:0 12px 30px rgba(27,27,58,.08)}
    h1{margin:0 0 8px;font-size:22px} p{margin:0 0 18px;color:#63637F}
    button{min-height:46px;padding:0 22px;border:0;border-radius:14px;background:#1B1B3A;color:#fff;font:700 15px system-ui;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>This page needs a connection. Pages you have already opened, like your shoot schedule, still work. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
